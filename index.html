<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走位分段练习 · わたしの一番かわいいところ</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 0 auto;
         padding: 16px 12px; background: #16161f; color: #eee; }
  #videoWrap { position: relative; width: 100%; aspect-ratio: 16/9;
               border-radius: 10px; overflow: hidden; background:#000; }
  #videoWrap iframe { position: absolute; width: 100%; height: 100%; border: none; }
  .row { text-align: center; margin: 10px 0; }
  .btn { display: inline-block; margin: 4px; padding: 10px 14px; border-radius: 8px;
         background: #2e2e4e; color: #fff; cursor: pointer; border: none; font-size: 14px; }
  .btn:hover { background: #4a6cf7; }
  .btn.active { background: #ff5c8a; }
  .btn.small { padding: 7px 12px; font-size: 13px; }
  #loopBtn.on { background: #2fae60; }
  .tip { color: #888; font-size: 13px; }
  #settingsPanel { background: #22223a; border-radius: 10px; padding: 14px;
                   max-width: 560px; margin: 10px auto; }
  .setRow { margin: 10px 0; text-align: center; }
  .setRow input { padding: 8px 10px; border-radius: 6px; border: 1px solid #555;
                  background: #16161f; color: #eee; font-size: 14px; width: 210px; }
  .setRow label { color: #bbb; font-size: 14px; }
  #stageWrap { display: flex; justify-content: center; }
  /* 舞台 = 12列 × 7行 × 48px = 576×336，中心线与竖网格线重合 */
  #stage { position: relative; width: 576px; height: 336px; flex: none;
           transform-origin: top center;
           background-color: #20202c;
           background-image:
             linear-gradient(90deg, transparent calc(50% - 1.5px), #9a9ad0 calc(50% - 1.5px),
                             #9a9ad0 calc(50% + 1.5px), transparent calc(50% + 1.5px)),
             linear-gradient(#3a3a55 1px, transparent 1px),
             linear-gradient(90deg, #3a3a55 1px, transparent 1px);
           background-size: 100% 100%, 48px 48px, 48px 48px;
           border: 2px solid #444; border-radius: 4px; }
  .dot { position: absolute; width: 40px; height: 40px; border-radius: 50%;
         color: #111; font-weight: bold; font-size: 16px; z-index: 2;
         display: flex; align-items: center; justify-content: center;
         cursor: pointer; transform: translate(-50%,-50%);
         border: 2px solid rgba(255,255,255,.35);
         box-shadow: 0 0 6px rgba(0,0,0,.6);
         transition: left 1.2s ease, top 1.2s ease, opacity .3s, box-shadow .3s; }
  .dot.dim { opacity: .22; filter: saturate(.4); }
  .dot.solo { box-shadow: 0 0 16px 4px rgba(255,255,255,.55); z-index: 4; }
  .cpos { position: absolute; color: #ff2d55; font-size: 36px; font-weight: bold;
          transform: translate(-50%,-50%); pointer-events: none; z-index: 1;
          display: none; }
  #info { text-align: center; color: #aaa; font-size: 14px; }
  a { color: #5fb8f0; }
</style>
</head>
<body>

<div id="videoWrap">
  <iframe id="bili"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture; playsinline"
          webkitallowfullscreen mozallowfullscreen allowfullscreen
          playsinline scrolling="no"></iframe>
</div>

<div class="tip" style="text-align:center; color:#f06ea9; margin:8px 0;">
  📱 iPhone：点段落按钮后需<b>再点一下视频画面</b>才开始播（系统限制）<br>
  ⏸ 暂停后若视频自己恢复播放、或画面与走位图对不上 → 点「🔄 同步」校准
</div>

<div class="row">
  <button id="loopBtn" class="btn small">🔁 循环本段：关</button>
  <button id="syncBtn" class="btn small">🔄 同步</button>
  <button id="setBtn" class="btn small">⚙️ 设置</button>
</div>

<div id="settingsPanel" style="display:none;">
  <div class="setRow">
    <label>视频BV号：</label>
    <input id="bvInput" type="text" placeholder="BV1gwVSzGERx">
  </div>
  <div class="setRow">
    <label>时间偏移（秒）：</label>
    <input id="offsetInput" type="number" step="0.1" min="-3" max="3" value="0">
    <div class="tip" style="margin-top:4px;">新版进鼓更晚 → 填正值；更早 → 填负值。范围 -3 ~ 3，支持小数</div>
  </div>
  <div class="setRow">
    <button id="saveSet" class="btn small">💾 保存并应用</button>
    <button id="resetSet" class="btn small">↩️ 恢复默认</button>
  </div>
</div>

<div id="chapters" class="row"></div>
<div id="info"></div>

<div id="stageWrap"><div id="stage"></div></div>

<div class="tip" style="text-align:center; margin-top:6px;">
  💡 点击任意圆点可<b>单独高亮</b>该成员（其余变暗），再点一次或点空白处恢复<br>
  ❌ = C位空缺标记｜视频没反应时也可 <a id="openBtn" href="#" target="_blank">在新窗口打开B站对应时间点 →</a>
</div>

<script>
const DEFAULT_BV = "BV1gwVSzGERx";
const bili = document.getElementById("bili");
const loopBtn = document.getElementById("loopBtn");
const syncBtn = document.getElementById("syncBtn");
const setBtn = document.getElementById("setBtn");
const settingsPanel = document.getElementById("settingsPanel");
const bvInput = document.getElementById("bvInput");
const offsetInput = document.getElementById("offsetInput");
const openBtn = document.getElementById("openBtn");

// ============ 设置：BV号 + 偏移量 ============
let settings = { bvid: DEFAULT_BV, offset: 0 };
try {
  const s = JSON.parse(localStorage.getItem("danceSettings_v1"));
  if (s && /^BV[0-9A-Za-z]{10}$/.test(s.bvid) && isFinite(s.offset)) settings = s;
} catch(e){}
function saveSettings() {
  localStorage.setItem("danceSettings_v1", JSON.stringify(settings));
}
bvInput.value = settings.bvid;
offsetInput.value = settings.offset;

setBtn.onclick = () => {
  settingsPanel.style.display = settingsPanel.style.display === "none" ? "block" : "none";
};

document.getElementById("saveSet").onclick = () => {
  const m = bvInput.value.trim().match(/BV[0-9A-Za-z]{10}/);
  if (!m) { alert("BV号格式不对：请填 BV 开头的编号，或直接粘贴视频链接"); return; }
  let off = parseFloat(offsetInput.value);
  if (isNaN(off)) off = 0;
  off = Math.max(-3, Math.min(3, off));
  settings = { bvid: m[0], offset: off };
  saveSettings();
  jumpCurrent();
  settingsPanel.style.display = "none";
};

document.getElementById("resetSet").onclick = () => {
  settings = { bvid: DEFAULT_BV, offset: 0 };
  saveSettings();
  bvInput.value = DEFAULT_BV;
  offsetInput.value = 0;
  jumpCurrent();
  settingsPanel.style.display = "none";
};

function jumpCurrent() {
  segStartAt = Date.now();
  const sec = (curSeg ? curSeg.sec : 0) + settings.offset;
  setPlayer(Math.max(0, sec));
}

// ============ 播放器加载 ============
function setPlayer(sec) {
  const rand = Date.now();
  bili.src = `https://player.bilibili.com/player.html?bvid=${settings.bvid}` +
             `&t=${Math.max(0, sec)}&autoplay=1&muted=1&danmaku=0&high_quality=1&rand=${rand}`;
}
setPlayer(Math.max(0, settings.offset));

// ============ 走位数据：35段 · 编辑器实测（12列×7行，中心=列6） ============
const segments = [
  { sec:1,   1:[6,3], 2:[5,2], 3:[7,4], 4:[4,3], 5:[8,3], 6:[7,2], 7:[5,4] },
  { sec:20,  1:[6,3], 2:[7,4], 3:[5,2], 4:[8,3], 5:[4,3], 6:[5,4], 7:[7,2] },
  { sec:21,  1:[6,3], 2:[8,5], 3:[5,2], 4:[9,4], 5:[3,2], 6:[4,3], 7:[7,4] },
  { sec:29,  1:[8,3], 2:[8,5], 3:[5,4], 4:[9,4], 5:[3,4], 6:[4,5], 7:[7,4] },
  { sec:32,  1:[8,3], 2:[8,5], 3:[5,4], 4:[9,4], 5:[3,4], 6:[4,5], 7:[6,5] },
  { sec:34,  1:[7.5,3.5], 2:[6.5,3], 3:[5.5,3.5], 4:[7,4.5], 5:[4.5,5], 6:[3.5,3.5], 7:[6,5] },
  { sec:36,  1:[7.5,3.5], 2:[5.5,3], 3:[6,4], 4:[7,4.5], 5:[5,4.5], 6:[4.5,3.5], 7:[6.5,3] },
  { sec:41,  1:[7.5,3.5], 2:[6.5,3.5], 3:[4.5,3.5], 4:[6,4.5], 5:[7,5.5], 6:[5,4.5], 7:[5.5,3.5] },
  { sec:49,  1:[6,4.5], 2:[7,4.5], 3:[5.5,3.5], 4:[6.5,3.5], 5:[7.5,3.5], 6:[5,4.5], 7:[4.5,3.5] },
  { sec:56,  1:[6,3.5], 2:[7.5,4.5], 3:[5.5,2.5], 4:[6.5,2.5], 5:[8,3.5], 6:[4.5,4.5], 7:[4,3.5] },
  { sec:64,  1:[7,2], 2:[9,4], 3:[6,3], 4:[5,2], 5:[8,3], 6:[3,4], 7:[4,3] },
  { sec:70,  1:[6,3], 2:[8,3], 3:[7,4], 4:[5,4], 5:[9,2], 6:[4,3], 7:[3,2] },
  { sec:89,  1:[6.5,3], 2:[7,4.5], 3:[6,4], 4:[5.5,2.5], 5:[7.5,3.5], 6:[4.5,2.5], 7:[3,3.5] },
  { sec:91,  1:[7,3.5], 2:[7,2.5], 3:[6,3], 4:[6,4], 5:[8,3], 6:[5,3.5], 7:[5,4.5] },
  { sec:94,  1:[6.5,3.5], 2:[7,2.5], 3:[6,2.5], 4:[5.5,3.5], 5:[7.5,3.5], 6:[5,2.5], 7:[4.5,4] },
  { sec:98,  1:[7,3], 2:[6.5,3], 3:[5.5,3], 4:[6,4], 5:[7.5,3], 6:[5,3], 7:[4.5,3] },
  { sec:102, 1:[7.5,3], 2:[7,3], 3:[6,3], 4:[4,3], 5:[8,5], 6:[5.5,3], 7:[4.5,3] },
  { sec:106, 1:[8,3], 2:[7,3], 3:[6,3], 4:[3,3], 5:[9,3], 6:[5,3], 7:[4,3] },
  { sec:111, 1:[6,4], 2:[6,5], 3:[7,4], 4:[4,3], 5:[8,3], 6:[6,3], 7:[5,4] },
  { sec:113, 1:[6,5], 2:[8.5,4.5], 3:[7,4], 4:[4,3], 5:[8,3], 6:[6,4], 7:[5,4] },
  { sec:116, 1:[3,4.5], 2:[9,4.5], 3:[7,4], 4:[4,3], 5:[8,3], 6:[6,5], 7:[5,4] },
  { sec:125, 1:[6,3], 2:[6,4], 3:[6,5], 4:[8,3], 5:[7,4], 6:[5,4], 7:[4,3] },
  { sec:134, 1:[5,4], 2:[7,4], 3:[8,5], 4:[6,3], 5:[9,4], 6:[4,5], 7:[3,4] },
  { sec:141, 1:[5,4], 2:[7,4], 3:[9,5], 4:[6,3], 5:[8,4], 6:[3,5], 7:[4,4] },
  { sec:147, 1:[5,3], 2:[7,3], 3:[9,5], 4:[6,4], 5:[8,4], 6:[3,5], 7:[4,4] },
  { sec:162, 1:[6,4], 2:[6,2], 3:[8,3.5], 4:[6,3], 5:[8,2.5], 6:[4,3.5], 7:[4,2.5] },
  { sec:170, 1:[6,4], 2:[6.5,2.5], 3:[7.5,3.5], 4:[5,3], 5:[8.5,2.5], 6:[3,3.5], 7:[4,2] },
  { sec:175, 1:[6,4], 2:[6.5,3.5], 3:[7,3], 4:[5.5,3.5], 5:[7.5,2.5], 6:[5,3], 7:[4.5,2.5] },
  { sec:178, 1:[6,4], 2:[6.5,3.5], 3:[7,3], 4:[4,3.5], 5:[7.5,2.5], 6:[5,3], 7:[4.5,2.5] },
  { sec:182, 1:[6,4], 2:[8,3.5], 3:[7,3], 4:[4,3.5], 5:[7.5,2.5], 6:[5,3], 7:[4.5,2.5] },
  { sec:192, 1:[6,3], 2:[7,4], 3:[8,3], 4:[5,4], 5:[9,4], 6:[4,3], 7:[3,4] },
  { sec:207, 1:[7,2], 2:[6,3], 3:[9,3], 4:[5,2], 5:[8,4], 6:[3,3], 7:[4,4] },
  { sec:216, 1:[6,3], 2:[5,2], 3:[8,3], 4:[7,2], 5:[9,4], 6:[4,3], 7:[3,4] },
  { sec:222, 1:[6,4], 2:[5,4], 3:[8,4], 4:[7,4], 5:[9,4], 6:[4,4], 7:[3,4] },
  { sec:250, 1:[6,3], 2:[5.5,3], 3:[7,3], 4:[6.5,3], 5:[7.5,3], 6:[5,3], 7:[4.5,3] },
];

// 段落时间：本段从该截图秒开始，到下一段截图秒结束
segments.forEach((s, i) => {
  s.end = i < segments.length - 1 ? segments[i+1].sec : 256;
  s.name = `${Math.floor(s.sec/60)}:${String(s.sec%60).padStart(2,"0")}`;
});

const colors = { 1:"#f06ea9", 2:"#6ee07a", 3:"#e05252", 4:"#f5923e",
                 5:"#e8e33a", 6:"#a06ee0", 7:"#5fb8f0" };
const GRID = 48, COLS = 12, ROWS = 7;
const CX = 6, CY = 3.5;
const chapBox = document.getElementById("chapters");
const stage = document.getElementById("stage");
const stageWrap = document.getElementById("stageWrap");
const info = document.getElementById("info");

function fitStage() {
  const s = Math.min(1, (window.innerWidth - 24) / (COLS*GRID));
  stage.style.transform = `scale(${s})`;
  stageWrap.style.height = (ROWS*GRID * s) + "px";
}
window.addEventListener("resize", fitStage);
fitStage();

const dots = {};
for (const id in colors) {
  const d = document.createElement("div");
  d.className = "dot";
  d.style.background = colors[id];
  d.textContent = id;
  d.onclick = (e) => { e.stopPropagation(); soloId = (soloId===id)?null:id; applySolo(); };
  stage.appendChild(d);
  dots[id] = d;
}

const xMark = document.createElement("div");
xMark.className = "cpos"; xMark.textContent = "✕";
xMark.style.left = (CX*GRID)+"px"; xMark.style.top = (CY*GRID)+"px";
stage.appendChild(xMark);

let soloId = null;
function applySolo() {
  for (const k in dots) {
    dots[k].classList.toggle("dim", soloId !== null && k !== soloId);
    dots[k].classList.toggle("solo", k === soloId);
  }
  updateInfo();
}
stage.addEventListener("click", () => { soloId = null; applySolo(); });

function formation(seg) {
  xMark.style.display = seg.x ? "block" : "none";
  Object.entries(seg).forEach(([k, v]) => {
    if (isNaN(k)) return;
    dots[k].style.left = (v[0] * GRID) + "px";
    dots[k].style.top  = (v[1] * GRID) + "px";
  });
}

function highlight(seg) {
  document.querySelectorAll("#chapters .btn").forEach((b, j) =>
    b.classList.toggle("active", segments[j] === seg));
}

function updateInfo() {
  if (!curSeg) return;
  info.textContent = "▶ " + curSeg.name +
    (curSeg.x ? " ❌C位空缺" : "") + (soloId ? `（已高亮 ${soloId} 号）` : "");
}

function playSegment(i, seg) {
  highlight(seg);
  formation(seg);
  curSeg = seg;
  segStartAt = Date.now();
  updateInfo();
  const sec = Math.max(0, seg.sec + settings.offset);
  setPlayer(sec);
  openBtn.href = `https://www.bilibili.com/video/${settings.bvid}?t=${sec}`;
}

segments.forEach((seg, i) => {
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = seg.name;
  btn.onclick = () => playSegment(i, seg);
  chapBox.appendChild(btn);
});

// ============ 循环 + 自动跟随 ============
let loopOn = false, curSeg = null, segStartAt = Date.now();
curSeg = segments[0];
formation(curSeg);
highlight(curSeg);
updateInfo();
openBtn.href = `https://www.bilibili.com/video/${settings.bvid}`;

loopBtn.onclick = () => {
  loopOn = !loopOn;
  loopBtn.textContent = loopOn ? "🔁 循环本段：开" : "🔁 循环本段：关";
  loopBtn.classList.toggle("on", loopOn);
  if (loopOn) segStartAt = Date.now();
};

syncBtn.onclick = () => {
  segStartAt = Date.now();
  setPlayer(Math.max(0, curSeg.sec + settings.offset));
};

setInterval(() => {
  if (!curSeg) return;
  const elapsed = (Date.now() - segStartAt) / 1000;

  if (loopOn) {
    if (elapsed >= curSeg.end - curSeg.sec) {
      segStartAt = Date.now();
      setPlayer(Math.max(0, curSeg.sec + settings.offset));
    }
    return;
  }

  const vpos = curSeg.sec + settings.offset + elapsed;
  const seg = segments.find(s =>
    vpos >= s.sec + settings.offset && vpos < s.end + settings.offset);
  if (seg && seg !== curSeg) {
    curSeg = seg;
    segStartAt = Date.now();
    formation(seg);
    highlight(seg);
    updateInfo();
  }
}, 200);
</script>

</body>
</html>
