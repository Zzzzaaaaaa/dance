<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走位分段练习 MP4版  v2</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; background: #16161f; color: #eee; }
  .tip { color: #888; font-size: 13px; }
  .btn { display: inline-block; margin: 3px; padding: 8px 12px; border-radius: 7px;
         background: #2e2e4e; color: #fff; cursor: pointer; border: none; font-size: 13px; }
  .btn:hover { background: #4a6cf7; }
  .btn.active { background: #ff5c8a; }
  .btn.small { padding: 7px 12px; }
  #loopBtn.on { background: #2fae60; }
  #layout { display: flex; gap: 14px; max-width: 1180px; margin: 0 auto; align-items: flex-start; }
  #main { flex: 1 1 auto; min-width: 0; }
  #side { flex: 0 0 190px; position: sticky; top: 12px; }
  #sideList { max-height: 80vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
              padding: 10px; background: #1c1c2a; border-radius: 10px; }
  #sideList .btn { margin: 0; width: 100%; box-sizing: border-box; }
  #sideList::-webkit-scrollbar { width: 6px; }
  #sideList::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  #videoWrap { position: relative; width: 100%; aspect-ratio: 16/9;
               border-radius: 10px; overflow: hidden; background: #000; }
  #danceVideo { position: absolute; width: 100%; height: 100%; object-fit: contain; }
  #playOverlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none;
                 align-items: center; justify-content: center; background: rgba(0,0,0,.55);
                 z-index: 10; cursor: pointer; }
  #playOverlay .big { width: 84px; height: 84px; border-radius: 50%;
                      background: rgba(255,255,255,.92); color: #16161f; font-size: 34px;
                      display: flex; align-items: center; justify-content: center; }
  #overlayMsg { position: absolute; bottom: 12px; left: 8px; right: 8px; text-align: center;
                color: #ffe9a0; font-size: 13px; text-shadow: 0 1px 3px #000; }
  .row { text-align: center; margin: 8px 0; }
  #info { text-align: center; color: #aaa; font-size: 14px; margin: 6px 0; }
  #stageWrap { display: flex; justify-content: center; margin-top: 8px; }
  #stage { position: relative; width: 720px; height: 420px; flex: none;
           transform-origin: top center;
           background-color: #20202c;
           background-image:
             linear-gradient(90deg, transparent calc(50% - 1.5px), #9a9ad0 calc(50% - 1.5px),
                             #9a9ad0 calc(50% + 1.5px), transparent calc(50% + 1.5px)),
             linear-gradient(#3a3a55 1px, transparent 1px),
             linear-gradient(90deg, #3a3a55 1px, transparent 1px);
           background-size: 100% 100%, 60px 60px, 60px 60px;
           border: 2px solid #444; border-radius: 4px; }
  .dot { position: absolute; width: 36px; height: 36px; border-radius: 50%;
         color: #111; font-weight: bold; font-size: 15px; z-index: 2;
         display: flex; align-items: center; justify-content: center;
         cursor: pointer; transform: translate(-50%,-50%);
         border: 2px solid rgba(255,255,255,.45);
         box-shadow: 0 0 5px rgba(0,0,0,.6);
         transition: left 1.2s ease, top 1.2s ease, opacity .3s, width .15s, height .15s; }
  .dot:hover, .dot:active { z-index: 5; width: 44px; height: 44px; font-size: 18px; }
  .dot.dim { opacity: .22; filter: saturate(.4); }
  .dot.solo { box-shadow: 0 0 16px 4px rgba(255,255,255,.55); z-index: 4; }
  .cpos { position: absolute; color: #ff2d55; font-size: 38px; font-weight: bold;
          transform: translate(-50%,-50%); pointer-events: none; z-index: 1; display: none; }
  #settingsPanel { background: #22223a; border-radius: 10px; padding: 14px;
                   max-width: 560px; margin: 10px 0; }
  .setRow { margin: 10px 0; text-align: center; }
  .setRow input { padding: 8px 10px; border-radius: 6px; border: 1px solid #555;
                  background: #16161f; color: #eee; font-size: 14px; width: 210px; }
  @media (max-width: 900px) {
    #layout { flex-direction: column; }
    #side { flex: none; position: static; width: 100%; }
    #sideList { flex-direction: row; overflow-x: auto; overflow-y: hidden;
                max-height: none; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    #sideList .btn { width: auto; flex: none; }
  }
</style>
</head>
<body>

<div id="layout">
  <div id="main">
    <div id="videoWrap">
      <video id="danceVideo" controls muted playsinline webkit-playsinline preload="auto"></video>
      <div id="playOverlay"><div class="big">▶</div><div id="overlayMsg"></div></div>
    </div>

    <div class="tip" style="text-align:center; color:#f06ea9; margin:6px 0; font-size:12px;">
      🔇 默认静音自动播放；想听声音点视频自带的音量键 ｜ MP4版 v2
    </div>

    <div class="row">
      <button id="loopBtn" class="btn small">🔁 循环本段：关</button>
      <button id="syncBtn" class="btn small">⏪ 本段重播</button>
      <button id="setBtn" class="btn small">⚙️ 设置</button>
    </div>

    <div id="settingsPanel" style="display:none;">
      <div class="setRow">
        <label>视频文件名（或网址）：</label><br>
        <input id="srcInput" type="text" placeholder="dance.mp4">
      </div>
      <div class="setRow">
        <button id="pickBtn" class="btn small">📂 选择手机/电脑里的MP4</button>
        <div class="tip" style="margin-top:4px;">本地打开页面时用（刷新后需重选）</div>
      </div>
      <div class="setRow">
        <label>时间偏移（秒）：</label>
        <input id="offsetInput" type="number" step="0.1" min="-3" max="3" value="0">
      </div>
      <div class="setRow">
        <button id="saveSet" class="btn small">💾 保存并应用</button>
        <button id="resetSet" class="btn small">↩️ 恢复默认</button>
      </div>
    </div>
    <input type="file" id="fileInput" accept="video/*" style="display:none">

    <div id="info"></div>
    <div id="stageWrap"><div id="stage"></div></div>
    <div class="tip" style="text-align:center; margin-top:4px;">
      💡 圆点挤在一起时，碰一下哪个就放大到最上层｜点击圆点可单独高亮成员
    </div>
  </div>

  <div id="side">
    <div id="sideList"></div>
    <div class="tip" style="text-align:center; margin-top:6px; font-size:12px;" id="srcTip"></div>
  </div>
</div>

<script>
const video = document.getElementById("danceVideo");
const overlay = document.getElementById("playOverlay");
const overlayMsg = document.getElementById("overlayMsg");
const loopBtn = document.getElementById("loopBtn");
const syncBtn = document.getElementById("syncBtn");
const settingsPanel = document.getElementById("settingsPanel");
const srcInput = document.getElementById("srcInput");
const offsetInput = document.getElementById("offsetInput");
const fileInput = document.getElementById("fileInput");
const srcTip = document.getElementById("srcTip");

let settings = { src: "dance.mp4", offset: 0 };
try {
  const s = JSON.parse(localStorage.getItem("danceSettings_mp4"));
  if (s && typeof s.src === "string" && s.src && isFinite(s.offset)) settings = s;
} catch(e) {}
function saveSettings() { try { localStorage.setItem("danceSettings_mp4", JSON.stringify(settings)); } catch(e) {} }
srcInput.value = settings.src;
offsetInput.value = settings.offset;

let blobSrc = null, pendingSeek = null;

function seekTo(t) {
  if (video.readyState >= 1) { try { video.currentTime = t; } catch(e) {} }
  else pendingSeek = t;
}
function tryPlay() {
  const p = video.play();
  if (p && p.then) p.then(hideOverlay).catch(() => showOverlay(false));
}
function showOverlay(isError) {
  overlayMsg.textContent = isError
    ? "⚠️ 视频加载失败：把 dance.mp4 放到本页面同一文件夹，或点「⚙️设置→选择本地MP4」"
    : "▶ 点击开始播放（省电模式需手动点一下）";
  overlay.style.display = "flex";
}
function hideOverlay() { overlay.style.display = "none"; }
overlay.addEventListener("click", (e) => { e.stopPropagation(); tryPlay(); });
video.addEventListener("loadedmetadata", () => {
  if (pendingSeek != null) { try { video.currentTime = pendingSeek; } catch(e) {} pendingSeek = null; }
});
video.addEventListener("play", hideOverlay);
video.addEventListener("error", () => { if (video.currentSrc) showOverlay(true); });

function applySrc() {
  video.src = blobSrc || settings.src;
  pendingSeek = Math.max(0, (curSeg ? curSeg.sec : 0) + settings.offset);
  video.load();
  tryPlay();
  srcTip.textContent = "📎 视频：" + (blobSrc ? "本地选择的文件" : settings.src);
}
srcTip.textContent = "📎 视频：" + settings.src;

// ============ 走位数据：35段（12列×7行，中心=列6） ============
const segments = [
  { sec:1,   1:[6,3], 2:[5,2], 3:[7,4], 4:[4,3], 5:[8,3], 6:[7,2], 7:[5,4] },
  { sec:20,  1:[6,3], 2:[7,4], 3:[5,2], 4:[8,3], 5:[4,3], 6:[5,4], 7:[7,2] },
  { sec:21,  1:[6,3], 2:[8,5], 3:[5,2], 4:[9,4], 5:[3,2], 6:[4,3], 7:[7,4] },
  { sec:29,  1:[8,3], 2:[8,5], 3:[5,4], 4:[9,4], 5:[3,4], 6:[4,5], 7:[7,4] },
  { sec:32,  1:[8,3], 2:[8,5], 3:[5,4], 4:[9,4], 5:[3,4], 6:[4,5], 7:[6,5] },
  { sec:34,  1:[7.5,3.5], 2:[6.5,3], 3:[5.5,3.5], 4:[7,4.5], 5:[4.5,5], 6:[3.5,3.5], 7:[6,5] },
  { sec:36,  1:[7.5,3.5], 2:[5.5,3], 3:[6,4], 4:[7,4.5], 5:[5,4.5], 6:[4.5,3.5], 7:[6.5,3] },
  { sec:41,  1:[7.5,3.5], 2:[6.5,3.5], 3:[4.5,3.5], 4:[6,4.5], 5:[7,5.5], 6:[5,4.5], 7:[5.5,3.5] },
  { sec:49,  1:[6,4.5], 2:[7,4.5], 3:[5.5,3.5], 4:[6.5,3.5], 5:[7.5,3.5], 6:[5,4.5], 7:[4.5,3.5] },
  { sec:56,  1:[6,3.5], 2:[7.5,4.5], 3:[5.5,2.5], 4:[6.5,2.5], 5:[8,3.5], 6:[4.5,4.5], 7:[4,3.5] },
  { sec:64,  1:[7,2], 2:[9,4], 3:[6,3], 4:[5,2], 5:[8,3], 6:[3,4], 7:[4,3] },
  { sec:70,  1:[6,3], 2:[8,3], 3:[7,4], 4:[5,4], 5:[9,2], 6:[4,3], 7:[3,2] },
  { sec:89,  1:[6.5,3], 2:[7,4.5], 3:[6,4], 4:[5.5,2.5], 5:[7.5,3.5], 6:[4.5,2.5], 7:[3,3.5] },
  { sec:91,  1:[7,3.5], 2:[7,2.5], 3:[6,3], 4:[6,4], 5:[8,3], 6:[5,3.5], 7:[5,4.5] },
  { sec:94,  1:[6.5,3.5], 2:[7,2.5], 3:[6,2.5], 4:[5.5,3.5], 5:[7.5,3.5], 6:[5,2.5], 7:[4.5,4] },
  { sec:98,  1:[7,3], 2:[6.5,3], 3:[5.5,3], 4:[6,4], 5:[7.5,3], 6:[5,3], 7:[4.5,3] },
  { sec:102, 1:[7.5,3], 2:[7,3], 3:[6,3], 4:[4,3], 5:[8,5], 6:[5.5,3], 7:[4.5,3] },
  { sec:106, 1:[8,3], 2:[7,3], 3:[6,3], 4:[3,3], 5:[9,3], 6:[5,3], 7:[4,3] },
  { sec:111, 1:[6,4], 2:[6,5], 3:[7,4], 4:[4,3], 5:[8,3], 6:[6,3], 7:[5,4] },
  { sec:113, 1:[6,5], 2:[8.5,4.5], 3:[7,4], 4:[4,3], 5:[8,3], 6:[6,4], 7:[5,4] },
  { sec:116, 1:[3,4.5], 2:[9,4.5], 3:[7,4], 4:[4,3], 5:[8,3], 6:[6,5], 7:[5,4] },
  { sec:125, 1:[6,3], 2:[6,4], 3:[6,5], 4:[8,3], 5:[7,4], 6:[5,4], 7:[4,3] },
  { sec:134, 1:[5,4], 2:[7,4], 3:[8,5], 4:[6,3], 5:[9,4], 6:[4,5], 7:[3,4] },
  { sec:141, 1:[5,4], 2:[7,4], 3:[9,5], 4:[6,3], 5:[8,4], 6:[3,5], 7:[4,4] },
  { sec:147, 1:[5,3], 2:[7,3], 3:[9,5], 4:[6,4], 5:[8,4], 6:[3,5], 7:[4,4] },
  { sec:162, 1:[6,4], 2:[6,2], 3:[8,3.5], 4:[6,3], 5:[8,2.5], 6:[4,3.5], 7:[4,2.5] },
  { sec:170, 1:[6,4], 2:[6.5,2.5], 3:[7.5,3.5], 4:[5,3], 5:[8.5,2.5], 6:[3,3.5], 7:[4,2] },
  { sec:175, 1:[6,4], 2:[6.5,3.5], 3:[7,3], 4:[5.5,3.5], 5:[7.5,2.5], 6:[5,3], 7:[4.5,2.5] },
  { sec:178, 1:[6,4], 2:[6.5,3.5], 3:[7,3], 4:[4,3.5], 5:[7.5,2.5], 6:[5,3], 7:[4.5,2.5] },
  { sec:182, 1:[6,4], 2:[8,3.5], 3:[7,3], 4:[4,3.5], 5:[7.5,2.5], 6:[5,3], 7:[4.5,2.5] },
  { sec:192, 1:[6,3], 2:[7,4], 3:[8,3], 4:[5,4], 5:[9,4], 6:[4,3], 7:[3,4] },
  { sec:207, 1:[7,2], 2:[6,3], 3:[9,3], 4:[5,2], 5:[8,4], 6:[3,3], 7:[4,4] },
  { sec:216, 1:[6,3], 2:[5,2], 3:[8,3], 4:[7,2], 5:[9,4], 6:[4,3], 7:[3,4] },
  { sec:222, 1:[6,4], 2:[5,4], 3:[8,4], 4:[7,4], 5:[9,4], 6:[4,4], 7:[3,4] },
  { sec:250, 1:[6,3], 2:[5.5,3], 3:[7,3], 4:[6.5,3], 5:[7.5,3], 6:[5,3], 7:[4.5,3] },
];
segments.forEach((s, i) => {
  s.end = i < segments.length - 1 ? segments[i+1].sec : 256;
  s.name = `${Math.floor(s.sec/60)}:${String(s.sec%60).padStart(2,"0")}`;
});

const colors = { 1:"#f06ea9", 2:"#6ee07a", 3:"#e05252", 4:"#f5923e",
                 5:"#e8e33a", 6:"#a06ee0", 7:"#5fb8f0" };
const GRID = 60, COLS = 12, ROWS = 7;
const CX = 6, CY = 3.5;
const stage = document.getElementById("stage");
const stageWrap = document.getElementById("stageWrap");
const info = document.getElementById("info");
const sideList = document.getElementById("sideList");

function fitStage() {
  const avail = Math.min(window.innerWidth - 24, document.getElementById("main").clientWidth);
  const s = Math.min(1, avail / (COLS*GRID));
  stage.style.transform = "scale(" + s + ")";
  stageWrap.style.height = (ROWS*GRID * s) + "px";
}
window.addEventListener("resize", fitStage);
setTimeout(fitStage, 0);

const dots = {};
for (const id in colors) {
  const d = document.createElement("div");
  d.className = "dot";
  d.style.background = colors[id];
  d.textContent = id;
  d.onclick = (e) => { e.stopPropagation(); soloId = (soloId===id)?null:id; applySolo(); };
  stage.appendChild(d);
  dots[id] = d;
}
const xMark = document.createElement("div");
xMark.className = "cpos"; xMark.textContent = "✕";
xMark.style.left = (CX*GRID)+"px"; xMark.style.top = (CY*GRID)+"px";
stage.appendChild(xMark);

let soloId = null;
function applySolo() {
  for (const k in dots) {
    dots[k].classList.toggle("dim", soloId !== null && k !== soloId);
    dots[k].classList.toggle("solo", k === soloId);
  }
  updateInfo();
}
stage.addEventListener("click", () => { soloId = null; applySolo(); });

function formation(seg) {
  xMark.style.display = seg.x ? "block" : "none";
  Object.entries(seg).forEach(([k, v]) => {
    if (isNaN(k)) return;
    dots[k].style.left = (v[0] * GRID) + "px";
    dots[k].style.top  = (v[1] * GRID) + "px";
  });
}
function highlight(seg) {
  sideList.querySelectorAll(".btn").forEach((b, j) =>
    b.classList.toggle("active", segments[j] === seg));
  const act = sideList.querySelector(".btn.active");
  if (act && window.innerWidth <= 900)
    act.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}
function updateInfo() {
  if (!curSeg) return;
  info.textContent = "▶ " + curSeg.name +
    (curSeg.x ? " ❌C位空缺" : "") + (soloId ? `（已高亮 ${soloId} 号）` : "");
}

segments.forEach((seg, i) => {
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = seg.name;
  btn.onclick = () => {
    curSeg = seg;
    highlight(seg); formation(seg); updateInfo();
    seekTo(Math.max(0, seg.sec + settings.offset));
    tryPlay();
  };
  sideList.appendChild(btn);
});

document.getElementById("setBtn").onclick = () => {
  settingsPanel.style.display = settingsPanel.style.display === "none" ? "block" : "none";
};
document.getElementById("saveSet").onclick = () => {
  const newSrc = srcInput.value.trim() || "dance.mp4";
  let off = parseFloat(offsetInput.value);
  if (isNaN(off)) off = 0;
  off = Math.max(-3, Math.min(3, off));
  const srcChanged = newSrc !== settings.src;
  settings = { src: newSrc, offset: off };
  saveSettings();
  if (srcChanged) applySrc();
  else { seekTo(Math.max(0, curSeg.sec + off)); tryPlay(); }
  settingsPanel.style.display = "none";
};
document.getElementById("resetSet").onclick = () => {
  settings = { src: "dance.mp4", offset: 0 };
  saveSettings();
  srcInput.value = settings.src; offsetInput.value = 0;
  applySrc();
  settingsPanel.style.display = "none";
};
document.getElementById("pickBtn").onclick = () => fileInput.click();
fileInput.onchange = () => {
  const f = fileInput.files[0];
  if (!f) return;
  if (blobSrc) URL.revokeObjectURL(blobSrc);
  blobSrc = URL.createObjectURL(f);
  applySrc();
};

let loopOn = false, curSeg = segments[0];
formation(curSeg); highlight(curSeg); updateInfo();

document.getElementById("loopBtn").onclick = function() {
  loopOn = !loopOn;
  this.textContent = loopOn ? "🔁 循环本段：开" : "🔁 循环本段：关";
  this.classList.toggle("on", loopOn);
  if (loopOn) seekTo(Math.max(0, curSeg.sec + settings.offset));
};
document.getElementById("syncBtn").onclick = () => {
  seekTo(Math.max(0, curSeg.sec + settings.offset));
  tryPlay();
};

// 计时：直接读视频真实进度
setInterval(() => {
  if (!curSeg || video.readyState < 1) return;
  const t = video.currentTime, off = settings.offset;
  if (loopOn) {
    if (t >= curSeg.end + off - 0.05)
      video.currentTime = Math.max(0, curSeg.sec + off);
    return;
  }
  const vpos = t - off;
  const seg = segments.find(s => vpos >= s.sec && vpos < s.end);
  if (seg && seg !== curSeg) {
    curSeg = seg;
    formation(seg); highlight(seg); updateInfo();
  }
}, 200);

// 初始加载
pendingSeek = Math.max(0, settings.offset);
video.src = settings.src;
video.load();
tryPlay();
</script>

</body>
</html>
