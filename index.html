let loopOn = false, curSeg = null, soloId = null;
let pendingSeek = null;

function seekTo(t) {
  if (video.readyState >= 1) { try { video.currentTime = t; } catch(e) {} }
  else pendingSeek = t;

function tryPlay() {
  const p = video.play();

  if (pendingSeek != null) { try { video.currentTime = pendingSeek; } catch(e) {} pendingSeek = null; }
});

function setPct(p) {
  const v = Math.min(100, Math.floor(p));
  loadPct.textContent = v + "%";
  loadBar.style.width = v + "%";
}

/* XHR下载：兼容性最好（微信X5等老内核也能跑） */
function downloadXHR(url) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.responseType = "arraybuffer";
    xhr.onprogress = (e) => {
      if (e.lengthComputable) setPct(e.loaded / e.total * 100);
      else setPct(e.loaded / (16 * 1024 * 1024) * 100);
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300)
        resolve(new Blob([xhr.response], { type: "video/mp4" }));
      else reject(new Error("HTTP " + xhr.status));
    };
    xhr.onerror = () => reject(new Error("network"));
    xhr.send();
  });
}

/* fetch流式下载：现代浏览器用，百分比更精准 */
async function downloadStream(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  if (!resp.body || !resp.body.getReader) throw new Error("no-stream");
  const total = +resp.headers.get("Content-Length") || 0;
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    setPct(total ? received / total * 100 : received / (16*1024*1024) * 100);
  }
  setPct(100);
  return new Blob(chunks, { type: "video/mp4" });
}

async function trySource(url, label, useStream) {
  loadMsg.textContent = label;
  setPct(0);
  if (useStream) {
    try { return await downloadStream(url); }
    catch (e) { if (String(e.message) === "no-stream") return await downloadXHR(url); throw e; }
  }
  return await downloadXHR(url);
}

async function loadVideo() {
  if (blobReady) return;
  loadOverlay.style.display = "flex";
  const useStream = !IS_WECHAT;
  const sources = IS_WECHAT
    ? [[DIRECT_URL, "微信内加载中…（建议点右上角···在浏览器打开，更快）"],
       [CDN_URL,    "切换备用线路…"]]
    : [[CDN_URL,    "正在通过加速通道下载视频…"],
       [DIRECT_URL, "加速通道不可用，改用直连下载…"]];
  for (const [url, label] of sources) {
    try {
      cachedBlob = await trySource(url, label, useStream);
      blobReady = true;
      break;
    } catch (e) { console.warn("加载失败:", url, e); }
  }
  if (blobReady) {
    video.src = URL.createObjectURL(cachedBlob);
    video.load();
    loadMsg.textContent = "✅ 加载完成";
    srcTip.textContent = "📎 视频：dance4.mp4（已缓存，跳段零等待）";
    setTimeout(() => {
      loadOverlay.style.display = "none";
      seekTo(Math.max(0, (curSeg ? curSeg.sec : 0) + offset));
      tryPlay();
    }, 300);
  } else {
    loadMsg.textContent = "⚠️ 下载失败，请刷新页面重试（或点右上角在浏览器打开）";
  }
}

    if (e.code === 2) hint = "下载中断/文件损坏";
    else if (e.code === 3) hint = "解码失败（视频编码不是H.264）";
    else if (e.code === 4) hint = "文件不存在或格式不支持";
  }
  srcTip.textContent = "⚠️ 视频加载失败：" + hint;
});

  const t = (sec === 0) ? 0 : sec + offset;
  return `${Math.floor(t/60)}:${String(Math.round(t%60)).padStart(2,"0")}`;
}

                 5:"#e8e33a", 6:"#a06ee0", 7:"#5fb8f0" };
const COLS = 12, ROWS = 7;

function fitStage() {
  const w = stage.clientWidth;
  if (w) stage.style.height = (w * ROWS / COLS) + "px";
}
window.addEventListener("resize", () => { fitStage(); layoutMode(); });
setTimeout(fitStage, 0);
setTimeout(fitStage, 300);

const dots = {};
for (const id in colors) {
  const d = document.createElement("div");
  d.className = "dot";
  d.style.background = colors[id];
  d.textContent = id;
  d.onclick = (e) => { e.stopPropagation(); soloId = (soloId===id)?null:id; applySolo(); };
  stage.appendChild(d);
  dots[id] = d;
}
const xMark = document.createElement("div");
xMark.className = "cpos"; xMark.textContent = "✕";
xMark.style.left = "50%"; xMark.style.top = "50%";
stage.appendChild(xMark);

function applySolo() {
  for (const k in dots) {
    dots[k].classList.toggle("dim", soloId !== null && k !== soloId);
    dots[k].classList.toggle("solo", k === soloId);
  }
  updateInfo();
}
stage.addEventListener("click", () => { soloId = null; applySolo(); });

function formation(seg) {
  xMark.style.display = seg.x ? "block" : "none";
  Object.entries(seg).forEach(([k, v]) => {
    if (isNaN(k)) return;
    dots[k].style.left = (v[0] / COLS * 100) + "%";
    dots[k].style.top  = (v[1] / ROWS * 100) + "%";
  });
}
function highlight(seg) {
  sideList.querySelectorAll(".btn").forEach((b, j) =>
    b.classList.toggle("active", segments[j] === seg));
  const act = sideList.querySelector(".btn.active");
  if (act && mq.matches)
    act.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}
function updateInfo() {
  if (!curSeg) return;
  info.textContent = "▶ " + curSeg.name +
    (curSeg.x ? " ❌C位空缺" : "") + (soloId ? `（已高亮 ${soloId} 号）` : "");
}

segments.forEach((seg) => {
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = seg.name;
  btn.onclick = () => {
    curSeg = seg;
    highlight(seg); formation(seg); updateInfo();
    seekTo(Math.max(0, seg.sec + offset));
    if (blobReady) tryPlay();
    else loadVideo();
  };
  sideList.appendChild(btn);
});

curSeg = segments[0];
formation(curSeg); highlight(curSeg); updateInfo();
layoutMode();

loadVideo();

document.getElementById("loopBtn").onclick = function() {
  loopOn = !loopOn;
  this.textContent = loopOn ? "🔁 循环本段：开" : "🔁 循环本段：关";
  this.classList.toggle("on", loopOn);
  if (loopOn) seekTo(Math.max(0, curSeg.sec + offset));
};
document.getElementById("syncBtn").onclick = () => {
  seekTo(Math.max(0, curSeg.sec + offset));
  if (blobReady) tryPlay();
};

setInterval(() => {
  if (!curSeg || video.readyState < 1) return;
  const t = video.currentTime;
  if (loopOn) {
    if (t >= curSeg.end + offset - 0.05)
      video.currentTime = Math.max(0, curSeg.sec + offset);
    return;
  }
  const vpos = t - offset;
  const seg = segments.find(s => vpos >= s.sec && vpos < s.end);
  if (seg && seg !== curSeg) {
    curSeg = seg;
    formation(seg); highlight(seg); updateInfo();
  }
}, 200);
</script>

</body>
</html>
