<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我最可爱的地方 - 走位分段练习 v3.1</title>
<!--
  ============ 改动记录 ============
  v3.1
    - 标题改为歌名「我最可爱的地方」
    - 走位图放大（最大720→900px），圆点缩小（36→26px），更清楚
    - 只保留 dance4.mp4 一个视频
    - dance4 偏移量内置为 3 秒
  v3.0（大简化）
    - 纯直连、点击播放（无声自动播放的坑全部移除）
    - 循环本段 / 偏移微调 / 本地选文件 / 成员高亮 保留
  =================================
-->
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; background: #16161f; color: #eee;
         overflow-x: hidden; }
  h1 { text-align: center; font-size: 20px; margin: 6px 0 2px; color: #ffd7e6; }
  .tip { color: #888; font-size: 13px; }
  .btn { display: inline-block; margin: 3px; padding: 8px 12px; border-radius: 7px;
         background: #2e2e4e; color: #fff; cursor: pointer; border: none; font-size: 13px; }
  .btn:hover { background: #4a6cf7; }
  .btn.active { background: #ff5c8a; }
  .btn.small { padding: 7px 12px; }
  #loopBtn.on { background: #2fae60; }
  #layout { display: flex; gap: 14px; max-width: 1180px; margin: 0 auto; align-items: flex-start; }
  #main { flex: 1 1 auto; min-width: 0; width: 100%; }
  #side { flex: 0 0 190px; position: sticky; top: 12px; }
  #sideList { max-height: 80vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
              padding: 10px; background: #1c1c2a; border-radius: 10px; }
  #sideList .btn { margin: 0; width: 100%; box-sizing: border-box; }
  #sideList::-webkit-scrollbar { width: 6px; height: 6px; }
  #sideList::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  #videoWrap { position: relative; width: 100%; max-width: 760px; margin: 0 auto;
               aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: #000; }
  #danceVideo { position: absolute; width: 100%; height: 100%; object-fit: contain; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
  #info { text-align: center; color: #aaa; font-size: 14px; margin: 6px 0; }
  #stage { position: relative; width: 100%; max-width: 900px; margin: 8px auto 0;
           background-color: #20202c; border: 2px solid #444; border-radius: 4px;
           aspect-ratio: 12/7;
           background-image:
             linear-gradient(#3a3a55 1px, transparent 1px),
             linear-gradient(90deg, #3a3a55 1px, transparent 1px);
           background-size: calc(100%/12) calc(100%/7); }
  .vline { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px;
           margin-left: -1.5px; background: #9a9ad0; z-index: 1; }
  .dot { position: absolute; width: 26px; height: 26px; border-radius: 50%;
         color: #111; font-weight: bold; font-size: 12px; z-index: 2;
         display: flex; align-items: center; justify-content: center;
         cursor: pointer; transform: translate(-50%,-50%);
         border: 2px solid rgba(255,255,255,.45);
         box-shadow: 0 0 4px rgba(0,0,0,.6);
         transition: left 1.2s ease, top 1.2s ease, opacity .3s, width .15s, height .15s; }
  .dot:hover, .dot:active { z-index: 5; width: 38px; height: 38px; font-size: 16px; }
  .dot.dim { opacity: .22; filter: saturate(.4); }
  .dot.solo { box-shadow: 0 0 14px 4px rgba(255,255,255,.55); z-index: 4; }
  .cpos { position: absolute; color: #ff2d55; font-size: 34px; font-weight: bold;
          transform: translate(-50%,-50%); pointer-events: none; z-index: 1; display: none; }
  #settingsPanel { background: #22223a; border-radius: 10px; padding: 14px;
                   max-width: 560px; margin: 10px 0; }
  .setRow { margin: 10px 0; text-align: center; }
  .setRow input { padding: 8px 10px; border-radius: 6px; border: 1px solid #555;
                  background: #16161f; color: #eee; font-size: 14px; width: 210px; }
  @media (max-width: 900px) {
    #layout { flex-direction: column; }
    #side { flex: none; position: static; width: 100%; display: none; }
    #side.mobile { display: block; }
    #sideList { flex-direction: row; overflow-x: auto; overflow-y: hidden;
                max-height: none; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    #sideList .btn { width: auto; flex: none; }
  }
</style>
</head>
<body>

<div id="layout">
  <div id="main">
    <h1>🎵 我最可爱的地方</h1>
    <div class="tip" style="text-align:center; color:#f06ea9; margin:2px 0 6px; font-size:12px;">
      点段落按钮播放对应段（有声）｜进度条可自由拖动 ｜ v3.1
    </div>

    <div class="row">
      <button id="loopBtn" class="btn small">🔁 循环本段：关</button>
      <button id="syncBtn" class="btn small">⏪ 本段重播</button>
      <button id="setBtn" class="btn small">⚙️ 设置</button>
    </div>

    <div id="settingsPanel" style="display:none;">
      <div class="setRow">
        <button id="pickBtn" class="btn small">📂 选择手机/电脑里的MP4</button>
      </div>
      <div class="setRow">
        <label>时间偏移微调（秒，内置为 3 秒）：</label>
        <input id="offsetInput" type="number" step="0.1" min="-10" max="10" value="3">
      </div>
      <div class="setRow">
        <button id="saveSet" class="btn small">💾 保存并应用</button>
        <button id="resetSet" class="btn small">↩️ 恢复默认(3s)</button>
      </div>
    </div>
    <input type="file" id="fileInput" accept="video/*" style="display:none">

    <div id="videoWrap">
      <video id="danceVideo" controls playsinline webkit-playsinline preload="metadata" src="dance4.mp4"></video>
    </div>

    <div id="mobileSlot" style="display:none;"></div>

    <div id="info"></div>
    <div id="stage">
      <div class="vline"></div>
    </div>
    <div class="tip" style="text-align:center; margin-top:4px;">
      💡 圆点挤在一起时，碰一下哪个就放大到最上层｜点击圆点可单独高亮成员
    </div>
  </div>

  <div id="side">
    <div id="sideList"></div>
    <div class="tip" style="text-align:center; margin-top:6px; font-size:12px;" id="srcTip"></div>
  </div>
</div>

<script>
const video = document.getElementById("danceVideo");
const settingsPanel = document.getElementById("settingsPanel");
const offsetInput = document.getElementById("offsetInput");
const fileInput = document.getElementById("fileInput");
const srcTip = document.getElementById("srcTip");
const side = document.getElementById("side");
const sideList = document.getElementById("sideList");
const mobileSlot = document.getElementById("mobileSlot");
const stage = document.getElementById("stage");
const videoWrap = document.getElementById("videoWrap");
const info = document.getElementById("info");

const mq = window.matchMedia("(max-width: 900px)");
function layoutMode() {
  if (mq.matches) {
    mobileSlot.style.display = "block";
    mobileSlot.appendChild(side);
    side.classList.add("mobile");
  } else {
    mobileSlot.style.display = "none";
    document.getElementById("layout").appendChild(side);
    side.classList.remove("mobile");
  }
}
mq.addEventListener ? mq.addEventListener("change", layoutMode) : mq.addListener(layoutMode);

/* ===== 设置：默认视频 dance4，偏移内置 3 秒 ===== */
const DEFAULTS = { src: "dance4.mp4", offsets: { "dance4.mp4": 3 } };
let settings = JSON.parse(JSON.stringify(DEFAULTS));
try {
  const s = JSON.parse(localStorage.getItem("danceSettings_v31"));
  if (s && typeof s.offsets === "object") {
    settings.offsets = Object.assign({}, DEFAULTS.offsets, s.offsets);
  }
} catch(e) {}
function saveSettings() { try { localStorage.setItem("danceSettings_v31", JSON.stringify(settings)); } catch(e) {} }
function curOff() { return settings.offsets[settings.src] || 0; }

let blobSrc = null, pendingSeek = null;
let loopOn = false, curSeg = null;

function seekTo(t) {
  if (video.readyState >= 1) { try { video.currentTime = t; } catch(e) {} }
  else pendingSeek = t;
}
function tryPlay() {
  const p = video.play();
  if (p && p.catch) p.catch(() => {});
}

video.addEventListener("loadedmetadata", () => {
  if (pendingSeek != null) { try { video.currentTime = pendingSeek; } catch(e) {} pendingSeek = null; }
});
video.addEventListener("error", () => {
  const e = video.error;
  let hint = "未知错误";
  if (e) {
    if (e.code === 2) hint = "下载中断/文件损坏";
    else if (e.code === 3) hint = "解码失败（视频编码不是H.264）";
    else if (e.code === 4) hint = "文件不存在或格式不支持";
  }
  srcTip.textContent = "⚠️ 视频加载失败：" + hint;
});

function applyOff() {
  offsetInput.value = curOff();
}

document.getElementById("setBtn").onclick = () => {
  applyOff();
  settingsPanel.style.display = settingsPanel.style.display === "none" ? "block" : "none";
};
document.getElementById("saveSet").onclick = () => {
  let off = parseFloat(offsetInput.value);
  if (isNaN(off)) off = 3;
  off = Math.max(-10, Math.min(10, off));
  settings.offsets[settings.src] = off;
  saveSettings();
  seekTo(Math.max(0, curSeg.sec + off));
  tryPlay();
  settingsPanel.style.display = "none";
};
document.getElementById("resetSet").onclick = () => {
  settings = JSON.parse(JSON.stringify(DEFAULTS));
  saveSettings();
  applyOff();
  seekTo(Math.max(0, curSeg.sec + curOff()));
  tryPlay();
  settingsPanel.style.display = "none";
};
document.getElementById("pickBtn").onclick = () => fileInput.click();
fileInput.onchange = () => {
  const f = fileInput.files[0];
  if (!f) return;
  if (blobSrc) URL.revokeObjectURL(blobSrc);
  blobSrc = URL.createObjectURL(f);
  video.src = blobSrc;
  video.load();
  seekTo(Math.max(0, curSeg.sec + curOff()));
};

// ============ 走位数据：35段 ============
const segments = [
  { sec:0,   1:[6,3], 2:[5,2], 3:[7,4], 4:[4,3], 5:[8,3], 6:[7,2], 7:[5,4] },
  { sec:18,  1:[6,3], 2:[7,4], 3:[5,2], 4:[8,3], 5:[4,3], 6:[5,4], 7:[7,2] },
  { sec:19,  1:[6,3], 2:[8,5], 3:[5,2], 4:[9,4], 5:[3,2], 6:[4,3], 7:[7,4] },
  { sec:27,  1:[8,3], 2:[8,5], 3:[5,4], 4:[9,4], 5:[3,4], 6:[4,5], 7:[7,4] },
  { sec:30,  1:[8,3], 2:[8,5], 3:[5,4], 4:[9,4], 5:[3,4], 6:[4,5], 7:[6,5] },
  { sec:32,  1:[7.5,3.5], 2:[6.5,3], 3:[4.5,3.5], 4:[7,4.5], 5:[4.5,5], 6:[3.5,3.5], 7:[6,5] },
  { sec:34,  1:[7.5,3.5], 2:[5.5,3], 3:[6,4], 4:[7,4.5], 5:[5,4.5], 6:[4.5,3.5], 7:[6.5,3] },
  { sec:39,  1:[7.5,3.5], 2:[6.5,3.5], 3:[4.5,3.5], 4:[6,4.5], 5:[7,5.5], 6:[5,4.5], 7:[5.5,3.5] },
  { sec:47,  1:[6,4.5], 2:[7,4.5], 3:[5.5,3.5], 4:[6.5,3.5], 5:[7.5,3.5], 6:[5,4.5], 7:[4.5,3.5] },
  { sec:54,  1:[6,3.5], 2:[7.5,4.5], 3:[5.5,2.5], 4:[6.5,2.5], 5:[8,3.5], 6:[4.5,4.5], 7:[4,3.5] },
  { sec:62,  1:[7,2], 2:[9,4], 3:[6,3], 4:[5,2], 5:[8,3], 6:[3,4], 7:[4,3] },
  { sec:68,  1:[6,3], 2:[8,3], 3:[7,4], 4:[5,4], 5:[9,2], 6:[4,3], 7:[3,2] },
  { sec:87,  1:[6.5,3], 2:[7,4.5], 3:[6,4], 4:[5.5,2.5], 5:[7.5,3.5], 6:[4.5,2.5], 7:[3,3.5] },
  { sec:89,  1:[7,3.5], 2:[7,2.5], 3:[6,3], 4:[6,4], 5:[8,3], 6:[5,3.5], 7:[5,4.5] },
  { sec:92,  1:[6.5,3.5], 2:[7,2.5], 3:[6,2.5], 4:[5.5,3.5], 5:[7.5,3.5], 6:[5,2.5], 7:[4.5,4] },
  { sec:96,  1:[7,3], 2:[6.5,3], 3:[5.5,3], 4:[6,4], 5:[7.5,3], 6:[5,3], 7:[4.5,3] },
  { sec:100, 1:[7.5,3], 2:[7,3], 3:[6,3], 4:[4,3], 5:[8,5], 6:[5.5,3], 7:[4.5,3] },
  { sec:104, 1:[8,3], 2:[7,3], 3:[6,3], 4:[3,3], 5:[9,3], 6:[5,3], 7:[4,3] },
  { sec:109, 1:[6,4], 2:[6,5], 3:[7,4], 4:[4,3], 5:[8,3], 6:[6,3], 7:[5,4] },
  { sec:111, 1:[6,5], 2:[8.5,4.5], 3:[7,4], 4:[4,3], 5:[8,3], 6:[6,4], 7:[5,4] },
  { sec:114, 1:[3,4.5], 2:[9,4.5], 3:[7,4], 4:[4,3], 5:[8,3], 6:[6,5], 7:[5,4] },
  { sec:123, 1:[6,3], 2:[6,4], 3:[6,5], 4:[8,3], 5:[7,4], 6:[5,4], 7:[4,3] },
  { sec:132, 1:[5,4], 2:[7,4], 3:[8,5], 4:[6,3], 5:[9,4], 6:[4,5], 7:[3,4] },
  { sec:139, 1:[5,4], 2:[7,4], 3:[9,5], 4:[6,3], 5:[8,4], 6:[3,5], 7:[4,4] },
  { sec:145, 1:[5,3], 2:[7,3], 3:[9,5], 4:[6,4], 5:[8,4], 6:[3,5], 7:[4,4] },
  { sec:160, 1:[6,4], 2:[6,2], 3:[8,3.5], 4:[6,3], 5:[8,2.5], 6:[4,3.5], 7:[4,2.5] },
  { sec:168, 1:[6,4], 2:[6.5,2.5], 3:[7.5,3.5], 4:[5,3], 5:[8.5,2.5], 6:[3,3.5], 7:[4,2] },
  { sec:173, 1:[6,4], 2:[6.5,3.5], 3:[7,3], 4:[5.5,3.5], 5:[7.5,2.5], 6:[5,3], 7:[4.5,2.5] },
  { sec:176, 1:[6,4], 2:[6.5,3.5], 3:[7,3], 4:[4,3.5], 5:[7.5,2.5], 6:[5,3], 7:[4.5,2.5] },
  { sec:180, 1:[6,4], 2:[8,3.5], 3:[7,3], 4:[4,3.5], 5:[7.5,2.5], 6:[5,3], 7:[4.5,2.5] },
  { sec:190, 1:[6,3], 2:[7,4], 3:[8,3], 4:[5,4], 5:[9,4], 6:[4,3], 7:[3,4] },
  { sec:205, 1:[7,2], 2:[6,3], 3:[9,3], 4:[5,2], 5:[8,4], 6:[3,3], 7:[4,4] },
  { sec:214, 1:[6,3], 2:[5,2], 3:[8,3], 4:[7,2], 5:[9,4], 6:[4,3], 7:[3,4] },
  { sec:220, 1:[6,4], 2:[5,4], 3:[8,4], 4:[7,4], 5:[9,4], 6:[4,4], 7:[3,4] },
  { sec:248, 1:[6,3], 2:[5.5,3], 3:[7,3], 4:[6.5,3], 5:[7.5,3], 6:[5,3], 7:[4.5,3] },
];
segments.forEach((s, i) => {
  s.end = i < segments.length - 1 ? segments[i+1].sec : 254;
  s.name = `${Math.floor(s.sec/60)}:${String(s.sec%60).padStart(2,"0")}`;
});

const colors = { 1:"#f06ea9", 2:"#6ee07a", 3:"#e05252", 4:"#f5923e",
                 5:"#e8e33a", 6:"#a06ee0", 7:"#5fb8f0" };
const COLS = 12, ROWS = 7;

function fitStage() {
  const w = stage.clientWidth;
  if (w) stage.style.height = (w * ROWS / COLS) + "px";
}
window.addEventListener("resize", () => { fitStage(); layoutMode(); });
setTimeout(fitStage, 0);
setTimeout(fitStage, 300);

const dots = {};
for (const id in colors) {
  const d = document.createElement("div");
  d.className = "dot";
  d.style.background = colors[id];
  d.textContent = id;
  d.onclick = (e) => { e.stopPropagation(); soloId = (soloId===id)?null:id; applySolo(); };
  stage.appendChild(d);
  dots[id] = d;
}
const xMark = document.createElement("div");
xMark.className = "cpos"; xMark.textContent = "✕";
xMark.style.left = "50%"; xMark.style.top = "50%";
stage.appendChild(xMark);

let soloId = null;
function applySolo() {
  for (const k in dots) {
    dots[k].classList.toggle("dim", soloId !== null && k !== soloId);
    dots[k].classList.toggle("solo", k === soloId);
  }
  updateInfo();
}
stage.addEventListener("click", () => { soloId = null; applySolo(); });

function formation(seg) {
  xMark.style.display = seg.x ? "block" : "none";
  Object.entries(seg).forEach(([k, v]) => {
    if (isNaN(k)) return;
    dots[k].style.left = (v[0] / COLS * 100) + "%";
    dots[k].style.top  = (v[1] / ROWS * 100) + "%";
  });
}
function highlight(seg) {
  sideList.querySelectorAll(".btn").forEach((b, j) =>
    b.classList.toggle("active", segments[j] === seg));
  const act = sideList.querySelector(".btn.active");
  if (act && mq.matches)
    act.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}
function updateInfo() {
  if (!curSeg) return;
  info.textContent = "▶ " + curSeg.name +
    (curSeg.x ? " ❌C位空缺" : "") + (soloId ? `（已高亮 ${soloId} 号）` : "");
}

segments.forEach((seg) => {
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = seg.name;
  btn.onclick = () => {
    curSeg = seg;
    highlight(seg); formation(seg); updateInfo();
    seekTo(Math.max(0, seg.sec + curOff()));
    tryPlay();
  };
  sideList.appendChild(btn);
});

curSeg = segments[0];
formation(curSeg); highlight(curSeg); updateInfo();
layoutMode();
applyOff();

document.getElementById("loopBtn").onclick = function() {
  loopOn = !loopOn;
  this.textContent = loopOn ? "🔁 循环本段：开" : "🔁 循环本段：关";
  this.classList.toggle("on", loopOn);
  if (loopOn) seekTo(Math.max(0, curSeg.sec + curOff()));
};
document.getElementById("syncBtn").onclick = () => {
  seekTo(Math.max(0, curSeg.sec + curOff()));
  tryPlay();
};

setInterval(() => {
  if (!curSeg || video.readyState < 1) return;
  const t = video.currentTime, off = curOff();
  if (loopOn) {
    if (t >= curSeg.end + off - 0.05)
      video.currentTime = Math.max(0, curSeg.sec + off);
    return;
  }
  const vpos = t - off;
  const seg = segments.find(s => vpos >= s.sec && vpos < s.end);
  if (seg && seg !== curSeg) {
    curSeg = seg;
    formation(seg); highlight(seg); updateInfo();
  }
}, 200);
</script>

</body>
</html>
