<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走位分段练习 · わたしの一番かわいいところ</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 0 auto;
         padding: 16px 12px; background: #16161f; color: #eee; }
  #videoWrap { position: relative; width: 100%; aspect-ratio: 16/9;
               border-radius: 10px; overflow: hidden; background:#000; }
  #videoWrap iframe { position: absolute; width: 100%; height: 100%; border: none; }
  .row { text-align: center; margin: 10px 0; }
  .btn { display: inline-block; margin: 4px; padding: 10px 14px; border-radius: 8px;
         background: #2e2e4e; color: #fff; cursor: pointer; border: none; font-size: 14px; }
  .btn:hover { background: #4a6cf7; }
  .btn.active { background: #ff5c8a; }
  .btn.small { padding: 7px 12px; font-size: 13px; }
  #loopBtn.on { background: #2fae60; }
  .tip { color: #888; font-size: 13px; }
  #stageWrap { display: flex; justify-content: center; }
  #stage { position: relative; width: 720px; height: 500px; flex: none;
           transform-origin: top center;
           background: repeating-linear-gradient(0deg, #20202c 0 49px, #2e2e3e 49px 50px),
                       repeating-linear-gradient(90deg, #20202c 0 49px, #2e2e3e 49px 50px);
           border: 2px solid #444; border-radius: 10px; }
  #stage::after { content: "▲ 后方"; position: absolute; top: 6px; left: 50%;
           transform: translateX(-50%); color: #666; font-size: 12px; }
  #stage::before { content: "▼ 观众"; position: absolute; bottom: 6px; left: 50%;
           transform: translateX(-50%); color: #666; font-size: 12px; }
  .dot { position: absolute; width: 52px; height: 52px; border-radius: 50%;
         color: #111; font-weight: bold; font-size: 20px;
         display: flex; align-items: center; justify-content: center;
         transition: all 1.2s ease; box-shadow: 0 0 8px rgba(0,0,0,.6); }
  #info { text-align: center; color: #aaa; font-size: 14px; }
  a { color: #5fb8f0; }
</style>
</head>
<body>

<div id="videoWrap">
  <iframe id="bili" allow="autoplay; fullscreen; encrypted-media"
          allowfullscreen scrolling="no"></iframe>
</div>

<div class="row">
  <button id="loopBtn" class="btn small">🔁 循环本段：关</button>
  <span class="tip">　先点段落按钮选好段落，再开循环</span>
</div>

<div id="chapters" class="row"></div>
<div id="info"></div>

<div id="stageWrap">
  <div id="stage"></div>
</div>

<div class="tip" style="text-align:center;">
  视频没反应时，也可 <a id="openBtn" href="#" target="_blank">在新窗口打开B站对应时间点 →</a><br>
  倍速请用B站播放器右下角 ⚙️ 设置
</div>

<script>
const BVID = "BV1gwVSzGERx";
const bili = document.getElementById("bili");
const loopBtn = document.getElementById("loopBtn");
const openBtn = document.getElementById("openBtn");

function setPlayer(sec) {
  const rand = Date.now();
  bili.src = `https://player.bilibili.com/player.html?bvid=${BVID}` +
             `&t=${sec}&autoplay=1&danmaku=0&high_quality=1&rand=${rand}`;
}
setPlayer(0);

const segments = [
  { start: 0,   end: 14,  name: "0:00 开场",
    2: [4.5,1], 6: [8.5,1], 4: [3,3], 1: [6.5,3], 5: [10,3], 7: [4,5], 3: [9,5] },
  { start: 14,  end: 21,  name: "0:14 三角展开",
    3: [4.5,1], 7: [8.5,1], 5: [3,3], 1: [6.5,3], 4: [10,3], 6: [3.5,5], 2: [8.5,5] },
  { start: 21,  end: 28,  name: "0:21 散开移动中",
    1:[6,3], 2:[7,1], 3:[4,4], 4:[9,4], 5:[3,3], 6:[10,3], 7:[8,1] },
  { start: 28,  end: 41,  name: "0:28 斜线",
    1:[6,3], 2:[8,1], 3:[4,5], 4:[7,3], 5:[3,4], 6:[9,4], 7:[6,1] },
  { start: 41,  end: 49,  name: "0:41 一字横排",
    1:[7,3], 2:[8,2], 3:[3,2], 4:[6,4], 5:[7,6], 6:[4,4], 7:[5,2] },
  { start: 49,  end: 64,  name: "0:49 横排保持",
    1:[7,3], 2:[9,3], 3:[3,3], 4:[5,3], 5:[7,6], 6:[4,4], 7:[6,3] },
  { start: 64,  end: 89,  name: "1:04 斜排移动",
    1:[6,3], 2:[9,2], 3:[4,4], 4:[8,4], 5:[3,2], 6:[5,5], 7:[7,2] },
  { start: 89,  end: 110, name: "1:29 前后两排",
    1:[5,3], 2:[9,3], 3:[4,2], 4:[6,2], 5:[7,2], 6:[6,5], 7:[8,5] },
  { start: 110, end: 146, name: "1:50 菱形",
    1:[6.5,3], 2:[6.5,1], 3:[4,3], 4:[9,3], 5:[6.5,5], 6:[4,5], 7:[9,5] },
  { start: 146, end: 176, name: "2:26 三角聚拢",
    1:[6.5,2], 2:[5,3], 3:[8,3], 4:[4,4], 5:[9,4], 6:[6,5], 7:[7,5] },
  { start: 176, end: 206, name: "2:56 V字形",
    1:[6.5,2], 2:[5,4], 3:[8,4], 4:[3,5], 5:[10,5], 6:[4,2], 7:[9,2] },
  { start: 206, end: 250, name: "3:26 三角",
    1:[6.5,1], 2:[5,2], 3:[8,2], 4:[3,4], 5:[10,4], 6:[5,5], 7:[8,5] },
  { start: 250, end: 256, name: "4:10 结尾横排",
    1:[7,2], 2:[9,2], 3:[3,2], 4:[11,2], 5:[5,2], 6:[8,2], 7:[4,2] },
];

const colors = { 1:"#f06ea9", 2:"#6ee07a", 3:"#e05252", 4:"#f5923e",
                 5:"#e8e33a", 6:"#a06ee0", 7:"#5fb8f0" };
const GRID = 48;
const chapBox = document.getElementById("chapters");
const stage = document.getElementById("stage");
const stageWrap = document.getElementById("stageWrap");
const info = document.getElementById("info");

function fmt(s) { return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

// 手机自适应：按屏幕宽度缩放走位图
function fitStage() {
  const s = Math.min(1, (window.innerWidth - 24) / 720);
  stage.style.transform = `scale(${s})`;
  stageWrap.style.height = (500 * s) + "px";
}
window.addEventListener("resize", fitStage);
fitStage();

// 循环本段
let loopOn = false, curSeg = null, segStartAt = 0;
setInterval(() => {
  if (!loopOn || !curSeg) return;
  const elapsed = (Date.now() - segStartAt) / 1000;
  if (elapsed >= curSeg.end - curSeg.start) {
    segStartAt = Date.now();
    setPlayer(curSeg.start);
  }
}, 500);

loopBtn.onclick = () => {
  loopOn = !loopOn;
  loopBtn.textContent = loopOn ? "🔁 循环本段：开" : "🔁 循环本段：关";
  loopBtn.classList.toggle("on", loopOn);
  if (loopOn && curSeg) segStartAt = Date.now();
};

// 走位图
const dots = {};
for (const id in colors) {
  const d = document.createElement("div");
  d.className = "dot";
  d.style.background = colors[id];
  d.textContent = id;
  stage.appendChild(d);
  dots[id] = d;
}

function formation(seg) {
  Object.entries(seg).forEach(([k, v]) => {
    if (!isNaN(k)) {
      dots[k].style.left = (v[0] * GRID) + "px";
      dots[k].style.top  = (v[1] * GRID + 20) + "px";
    }
  });
  info.textContent = "▶ " + seg.name;
}

function playSegment(i, seg) {
  document.querySelectorAll("#chapters .btn").forEach((b, j) =>
    b.classList.toggle("active", j === i));
  formation(seg);
  curSeg = seg;
  segStartAt = Date.now();
  setPlayer(seg.start);
  openBtn.href = `https://www.bilibili.com/video/${BVID}?t=${seg.start}`;
}

segments.forEach((seg, i) => {
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = seg.name;
  btn.onclick = () => playSegment(i, seg);
  chapBox.appendChild(btn);
});

formation(segments[0]);
document.querySelectorAll("#chapters .btn")[0].classList.add("active");
openBtn.href = `https://www.bilibili.com/video/${BVID}`;
</script>

</body>
</html>
